<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>EliasNote — canvas infinito, 100% offline</title>
    <meta
      name="description"
      content="EliasNote é um app desktop local-first de organização visual: canvas infinito, quadros aninhados, notas, tarefas e Excalidraw nativo. Sem contas, sem nuvem, sem sincronização."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="EliasNote — organize ideias em um canvas infinito" />
    <meta
      property="og:description"
      content="Notas, tarefas, imagens, quadros e desenhos Excalidraw no mesmo espaço visual. Tudo salvo no seu computador."
    />
    <link rel="icon" type="image/png" sizes="256x256" href="/favicon.png" />
    <script>
      // Aplica tema e cor de destaque antes da primeira pintura para evitar flash.
      (function () {
        var accents = ["blue", "emerald", "rose", "amber", "slate"];
        try {
          var storedTheme = localStorage.getItem("eliasnote-landing-theme");
          var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          var dark = storedTheme ? storedTheme === "dark" : prefersDark;
          document.documentElement.classList.toggle("dark", dark);

          var storedAccent = localStorage.getItem("eliasnote-landing-accent");
          document.documentElement.dataset.accent =
            storedAccent && accents.indexOf(storedAccent) >= 0 ? storedAccent : "blue";
        } catch (error) {
          document.documentElement.dataset.accent = "blue";
        }
      })();
    </script>
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="landing-root"></div>
    <noscript>
      <div style="max-width: 640px; margin: 48px auto; padding: 0 24px; font-family: system-ui, sans-serif; color: #1a1a1a">
        <h1>EliasNote</h1>
        <p>Ative o JavaScript para ver a página de divulgação ou baixe os instaladores em
          <a href="https://github.com/HenriqueNaTTo/EliasNote/releases">github.com/HenriqueNaTTo/EliasNote/releases</a>.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/landing/main.tsx"></script>
  </body>
</html>
