[package]
name = "eliasnote-setup"
version = "0.7.0"
description = "Instalador visual do EliasNote (assistente em Tauri, sem NSIS)"
authors = ["EliasNote"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "eliasnote_setup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
